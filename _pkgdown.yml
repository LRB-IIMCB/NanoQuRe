url: https://LRB-IIMCB.github.io/NanoQuRe/

template:
  bootstrap: 5
  bootswatch: flatly
  theme: arrow-light
  bslib:
    primary: "#612a78"
    link-color: "#612a78"
    navbar-bg: "#612a78"
    heading-color: "#612a78"
    # fonts as on the pod5R site (bootswatch yeti): Open Sans, light headings
    base_font: {google: {family: "Open Sans", wght: [300, 400, 700]}}
    font-family-sans-serif: '"Open Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol"'
    headings-font-weight: 300
  includes:
    in_header: |
      <style>
      /* Unify fonts: system font stack throughout */
      body, .contents, .contents p, .contents li,
      .contents table, .contents th, .contents td {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                     "Helvetica Neue", Arial, sans-serif;
        font-size: 1rem;
        line-height: 1.5;
      }

      /* Consistent table styling */
      .contents table {
        font-size: 0.95rem;
        border-collapse: collapse;
        width: 100%;
        margin-bottom: 1rem;
      }

      .contents th, .contents td {
        padding: 0.5rem 0.75rem;
        border: 1px solid #dee2e6;
        vertical-align: top;
      }

      .contents th {
        background-color: #f8f9fa;
        font-weight: 600;
      }

      /* Consistent code styling */
      .contents code {
        font-family: SFMono-Regular, Menlo, Monaco, Consolas,
                     "Liberation Mono", "Courier New", monospace;
        font-size: 0.875em;
        padding: 0.125rem 0.25rem;
        background-color: #f8f9fa;
        border-radius: 0.25rem;
      }
      </style>

home:
  title: "NanoQuRe: Quality Control for Oxford Nanopore Sequencing"
  description: >
    An R package for quality control of Oxford Nanopore sequencing data.
    Generates interactive plots, summary tables, and self-contained HTML
    reports from ONT sequencing summary files.
  sidebar:
    structure: [links, license, citation, authors, dev]

navbar:
  bg: primary
  structure:
    left: [intro, reference, articles]
    right: [search, github]
  components:
    intro:
      text: "Get Started"
      href: articles/getting-started.html
    articles:
      text: "Vignettes"
      menu:
        - text: "Getting Started"
          href: articles/getting-started.html
        - text: "Using Individual Functions"
          href: articles/individual-functions.html
        - text: "Plot Gallery"
          href: articles/plot-gallery.html
    github:
      icon: fab fa-github
      href: https://github.com/LRB-IIMCB/NanoQuRe
      aria-label: GitHub

articles:
  - title: "Vignettes"
    navbar: ~
    contents:
      - getting-started
      - individual-functions

  - title: "Gallery"
    desc: "Every plotting function on the bundled data, with argument variants"
    contents:
      - plot-gallery

reference:
  - title: "Report Generation"
    desc: "Generate a full HTML QC report"
    contents:
      - generate_report

  - title: "Summary Tables"
    desc: "Functions that return summary data frames or single values"
    contents:
      - sequencing_stats
      - quality_stats
      - calculate_n50

  - title: "Yield & Throughput Plots"
    desc: "Plots showing sequencing output and translocation speed over time"
    contents:
      - plot_cumulative_yield
      - plot_seq_throughput
      - plot_average_speed

  - title: "Quality & Length Plots"
    desc: "Plots showing read length and Q-score distributions and their change over time"
    contents:
      - plot_read_lengths
      - plot_quality_distribution
      - plot_double

  - title: "Channel Activity Plots"
    desc: "Plots showing the number of active channels and the yield per channel"
    contents:
      - plot_active_channels
      - pore_activity_heatmap

  - title: "Example Data"
    desc: "Bundled dataset for examples and vignettes"
    contents:
      - sample_data

  - title: "Package"
    contents:
      - NanoQuRe-package

footer:
  structure:
    left: developed_by
    right: built_with

news:
  one_page: true
  cran_dates: false
